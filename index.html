<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Sensible defaults; react-helmet-async overrides per route -->
    <title>Kloudfox — AI-powered website monitoring that predicts outages</title>
    <meta name="description" content="Kloudfox monitors your websites, APIs, and SSL certificates every 40 seconds from four continents. AI anomaly detection, smart alerts, and status pages in one clean platform." />
    <meta name="theme-color" content="#050510" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Discoverability -->
    <link rel="canonical" href="https://kloudfox.com/" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="alternate" type="application/rss+xml" title="Kloudfox blog" href="/rss.xml" />
    <link rel="me" href="https://twitter.com/kloudfox" />

    <!-- Favicons -->
    <link rel="icon" href="/lovable-uploads/eca8e4b3-e57a-4e31-9a4f-635c8901e628.png" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/lovable-uploads/eca8e4b3-e57a-4e31-9a4f-635c8901e628.png" />

    <!-- Default Open Graph & Twitter (overridden by react-helmet-async per page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kloudfox" />
    <meta property="og:title" content="Kloudfox — AI-powered website monitoring" />
    <meta property="og:description" content="40-second checks, multi-region probes, SSL monitoring, status pages. Free forever plan." />
    <meta property="og:url" content="https://kloudfox.com/" />
    <meta property="og:image" content="https://kloudfox.com/og/default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kloudfox" />

    <!-- Baseline organization JSON-LD (per-page structured data is injected by <SEO />) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kloudfox",
      "url": "https://kloudfox.com",
      "logo": "https://kloudfox.com/lovable-uploads/b5c94c8f-8b5c-4d46-89bb-c353f06e28ca.png",
      "sameAs": [
        "https://twitter.com/kloudfox",
        "http://linkedin.com/company/kloudfox",
        "https://www.instagram.com/thekloudfox/",
        "https://www.facebook.com/profile.php?id=61559311342847"
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
